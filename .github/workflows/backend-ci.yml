name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "core-service/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "core-service/**"
      - ".github/workflows/backend-ci.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/core-service
  DOTNET_VERSION: "8.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore core-service/

      - name: Build
        run: dotnet build core-service/ --configuration Release --no-restore

      - name: Run tests
        run: dotnet test core-service/tests/ --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core-service/tests/**/test-results.trx
