services:
  mongo:
    image: mongo:7
    container_name: loomis-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  core-api:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: loomis-core-api
    restart: unless-stopped
    environment:
      # Program.cs binds to PORT (Cloud Run style).
      PORT: "5000"
      ASPNETCORE_ENVIRONMENT: Development
      MongoDbSettings__ConnectionString: mongodb://mongo:27017
      MongoDbSettings__DatabaseName: courier_service_db
      # Placeholder Auth0 values for local startup; replace with real values if needed.
      Auth0__Domain: https://example-auth0-domain/
      Auth0__Audience: https://example-audience/
    ports:
      - "8080:5000"
    depends_on:
      - mongo

  admin-dashboard:
    image: node:20-alpine
    container_name: loomis-admin-dashboard
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./admin-dashboard:/app
      - admin_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    ports:
      - "4200:4200"
    depends_on:
      - core-api

volumes:
  mongo_data:
  admin_node_modules:
