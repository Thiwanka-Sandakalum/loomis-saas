apiVersion: v1
kind: Secret
metadata:
  name: core-service-secrets
  namespace: production
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/loomis?authSource=admin"
  Jwt__Secret: "${JWT_SECRET}"
  DB_USERNAME: "admin"
  DB_PASSWORD: "${DB_PASSWORD}"

---
apiVersion: v1
kind: Secret
metadata:
  name: brain-service-secrets
  namespace: production
type: Opaque
stringData:
  MONGODB_URI: "mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/loomis-brain?authSource=admin"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  JWT_SECRET: "${JWT_SECRET}"

---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: production
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
  MONGO_INITDB_DATABASE: "loomis"

---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: production
type: kubernetes.io/dockercfg
data:
  .dockercfg: ${DOCKERCFG}
