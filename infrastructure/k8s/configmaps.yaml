apiVersion: v1
kind: ConfigMap
metadata:
  name: core-service-config
  namespace: production
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:5000"
  JWT_ISSUER: "loomis-api"
  JWT_AUDIENCE: "loomis-client"
  LOG_LEVEL: "Information"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: brain-service-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "8000"
  LOG_LEVEL: "info"
  WORKERS: "4"
  CORE_SERVICE_URL: "http://core-service:5000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-dashboard-config
  namespace: production
data:
  NODE_ENV: "production"
  API_BASE_URL: "http://core-service:5000/api"
  BRAIN_API_BASE_URL: "http://brain-service:8000/api"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: production
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 20M;

        gzip on;
        gzip_vary on;
        gzip_comp_level 6;

        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;

            location = /index.html {
                add_header Cache-Control "public, max-age=0, must-revalidate" always;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }

            location / {
                try_files $uri $uri/ /index.html;
            }

            location /api/ {
                proxy_pass http://core-service:5000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
            }

            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
