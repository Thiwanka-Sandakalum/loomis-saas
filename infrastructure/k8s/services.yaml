apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: production
  labels:
    app: core-service
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: core-service

